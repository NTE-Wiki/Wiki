<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTE Wiki 》items DB | 异环Wiki 》物品数据库</title>
    <!-- 引入 PapaParse 解析 CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<div class="container">
    <div class="main-layout">
        <!-- 左侧：筛选与控制面板区域 -->
        <div class="sidebar">
            <div class="filter-card">
                <div class="top-bar">
                    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 切换夜间</button>
                    <button class="filter-toggle-btn" id="filterToggleBtn" onclick="toggleFilter()">同组筛选: 满足任意</button>
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索名称、介绍、描述...">
                </div>

                <!-- 主选单 -->
                <div class="master-tabs" id="masterTabs">
                    <button class="tab-btn active" onclick="switchMasterTab('全部')">全部</button>
                    <button class="tab-btn" onclick="switchMasterTab('礼物')">礼物</button>
                    <button class="tab-btn" onclick="switchMasterTab('食物')">食物</button>
                    <button class="tab-btn" onclick="switchMasterTab('家装')">家装</button>
                    <button class="tab-btn" onclick="switchMasterTab('道具')">道具</button>
                    <button class="tab-btn" onclick="switchMasterTab('物料')">物料</button>
                    <button class="tab-btn" onclick="switchMasterTab('重要物品')">重要物品</button>
                    <button class="tab-btn" onclick="switchMasterTab('特殊')">特殊</button>
                    <button class="tab-btn" onclick="switchMasterTab('其他背包')">其他背包</button>
                    
                </div>

                <!-- 动态属性选项 -->
                <div id="dynamicFilters"></div>

                <button class="clear-btn" id="clearBtn" onclick="resetFilters()">🗑️ 清除 0 个过滤器</button>
            </div>
        </div>

        <!-- 右侧：结果展示区域 -->
        <div class="content-area">
            <button class="sort-btn" id="sortBtn" onclick="toggleSort()">📊 价格排序: 默认</button>
            <div id="statusText" style="margin-bottom:15px; color:var(--gray-text); font-size: 14px;">正在读取数据库...</div>
            <div class="grid-container" id="cardsContainer"></div>
        </div>
    </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
        <img class="modal-img" id="modalImg" src="" onerror="this.onerror=null; this.src=fallbackImg;">
        <div class="modal-title" id="modalTitle">物品名称</div>
        <div class="modal-info-list">
            <div class="modal-info-item">
                <div class="modal-info-label">用途</div>
                <div class="modal-info-value" id="modalUsage">暂无</div>
            </div>
            <div class="modal-info-item">
                <div class="modal-info-label">介绍</div>
                <div class="modal-info-value" id="modalIntro">暂无</div>
            </div>
            <div class="modal-info-item">
                <div class="modal-info-label">获取途径</div>
                <div class="modal-info-value" id="modalSource">暂无</div>
            </div>
        </div>
    </div>
</div>

<script src="./assets/main.js"></script>
</body>
</html>
