<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTE Wiki 》items DB | 异环Wiki 》物品数据库</title>
    <!-- 引入 PapaParse 解析 CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-main: #eef2f7;
            --panel-bg: #dce3ed;
            --btn-bg: #edf1f7;
            --btn-active-bg: #000000;
            --btn-active-text: #ffffff;
            --text-color: #2b3648;
            --gray-text: #6e7c91;
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.05);
            --panel-shadow: 0 4px 15px rgba(0,0,0,0.05);
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        [data-theme="dark"] {
            --bg-main: #121824;
            --panel-bg: #1e2636;
            --btn-bg: #2a3447;
            --btn-active-bg: #ffffff;
            --btn-active-text: #000000;
            --text-color: #e2e8f0;
            --gray-text: #94a3b8;
            --card-bg: #1a2230;
            --input-bg: #222b3b;
            --input-border: #334155;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
            --panel-shadow: 0 4px 15px rgba(0,0,0,0.3);
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            margin: 20px;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            box-sizing: border-box;
            width: 100%;
        }

        /* 左右分栏布局：参考标准响应式，大屏左右，小屏上下 */
        .main-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }

        .sidebar {
            flex: 0 0 348px;
            position: sticky;
            top: 20px;
            box-sizing: border-box;
        }

        .content-area {
            flex: 1;
            min-width: 0;
            box-sizing: border-box;
        }

        .filter-card {
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--panel-shadow);
            margin-bottom: 25px;
            transition: background-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 180px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
        .character-select, .food-series-select, .home-series-select, .bags-series-select {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .filter-toggle-btn, .theme-toggle-btn, .sort-btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .filter-toggle-btn:hover, .theme-toggle-btn:hover, .sort-btn:hover {
            opacity: 0.8;
        }

        /* 主选单 */
        .master-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--input-border);
            padding-bottom: 12px;
        }
        .tab-btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--btn-active-bg);
            color: var(--btn-active-text);
        }

        .filter-group { margin-bottom: 15px; }
        .filter-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--text-color); }
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; box-sizing: border-box; }

        .tag-btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .tag-btn.active { background: var(--btn-active-bg); color: var(--btn-active-text); }

        .clear-btn {
            width: 100%;
            background: var(--btn-bg);
            border: none;
            padding: 10px;
            border-radius: 20px;
            color: var(--gray-text);
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .clear-btn:hover {
            opacity: 0.9;
        }

        /* 响应式网格流，auto-fill 配合 minmax */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
            gap: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
        }
        .item-card:hover { transform: translateY(-3px); }
        .item-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: var(--input-bg);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .item-name { font-weight: bold; font-size: 15px; margin-bottom: 6px; text-align: center; color: var(--text-color); width: 100%; word-break: break-all; }
        /* 修改后的 .item-name 容器 */
        .item-name { 
            font-weight: bold; 
            font-size: 15px; 
            margin-bottom: 6px; 
            text-align: center; 
            color: var(--text-color); 
            width: 100%; 
            
            /* 单行滚动核心设置 */
            white-space: nowrap;          /* 强制不换行 */
            overflow: hidden;             /* 隐藏超出容器的部分 */
            box-sizing: border-box;
            padding: 0 4px;
        }

        /* 内部文本承载元素 */
        .item-name-inner {
            display: inline-block;
            white-space: nowrap;
        }

        /* 自动平滑滚动 keyframes */
        @keyframes text-scroll {
            0%, 20% {
                transform: translateX(0); /* 前 20% 时间在起点停留，方便阅读开头 */
            }
            80%, 100% {
                /* 向左滚动超出部分 */
                transform: translateX(calc(-100% + 100%)); 
            }
        }

        /* 当文字超长添加 scroll 类时激活动画 */
        .item-name-inner.scroll {
            /* calc(-100% + 100%) 需要依靠偏移定位，建议用下面这个更简洁稳妥的 keyframes */
            animation: text-scroll-left 5s linear infinite alternate;
        }

        /* 更精确的左右往复滚动 Keyframes */
        @keyframes text-scroll-left {
            0%, 20% {
                transform: translateX(0);
            }
            80%, 100% {
                transform: translateX(var(--scroll-offset, -50%));
            }
        }

        /* 鼠标悬停在卡片上时暂停动画 */
        .item-card:hover .item-name-inner {
            animation-play-state: paused;
        }
        .item-attr { font-size: 12px; color: var(--gray-text); width: 100%; box-sizing: border-box; }
        .item-attr div { margin-bottom: 4px; white-space: pre-line; word-break: break-all; }
        
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-灰 { background-color: #a3a4a4; } 
        .dot-绿 { background-color: #22c55e; } 
        .dot-蓝 { background-color: #3b82f6; }
        .dot-紫 { background-color: #a855f7; } 
        .dot-金 { background-color: #eab308; }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--panel-shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .modal-close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--gray-text);
        }
        .modal-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: var(--input-bg);
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .modal-info-item {
            background: var(--input-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            box-sizing: border-box;
        }
        .modal-info-label {
            font-weight: bold;
            color: var(--gray-text);
            margin-bottom: 4px;
            font-size: 12px;
        }
        .modal-info-value {
            white-space: pre-line;
            line-height: 1.4;
            word-break: break-all;
        }

        /* 响应式断点：自适应折叠规则，屏幕较小时侧边栏移到上方 */
        @media (max-width: 1100px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                flex: none;
                width: 100%;
                position: static;
            }
            .content-area {
                width: 100%;
            }
        }
         /* 移动端适配，适当调大全局基础字号，控件整体放大 */
        @media (max-width: 768px) {
            body {
                margin: 10px;
                font-size: 16px;
            }
            .filter-card {
                padding: 20px;
                border-radius: 16px;
            }
            .top-bar {
                flex-direction: column;
                gap: 12px;
            }
            .search-input {
                font-size: 16px;
                padding: 14px 20px;
            }
            .filter-toggle-btn, .theme-toggle-btn, .sort-btn {
                font-size: 16px;
                padding: 12px 16px;
            }
            .tab-btn {
                font-size: 15px;
                padding: 10px 16px;
            }
            .tag-btn {
                font-size: 15px;
                padding: 10px 16px;
            }
            .character-select {
                font-size: 16px;
                padding: 10px 16px;
            }
            .clear-btn {
                font-size: 15px;
                padding: 14px;
            }
            .search-input, .theme-toggle-btn, .sort-btn {
                width: 100%;
                box-sizing: border-box;
                text-align: center;
                justify-content: center;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-layout">
        <!-- 左侧：筛选与控制面板区域 -->
        <div class="sidebar">
            <div class="filter-card">
                <div class="top-bar">
                    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 切换夜间</button>
                    <button class="filter-toggle-btn" id="filterToggleBtn" onclick="toggleFilter()">同组筛选: 满足任意</button>
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索名称、介绍、描述...">
                </div>

                <!-- 主选单 -->
                <div class="master-tabs" id="masterTabs">
                    <button class="tab-btn active" onclick="switchMasterTab('全部')">全部</button>
                    <button class="tab-btn" onclick="switchMasterTab('礼物')">礼物</button>
                    <button class="tab-btn" onclick="switchMasterTab('食物')">食物</button>
                    <button class="tab-btn" onclick="switchMasterTab('家装')">家装</button>
                    <button class="tab-btn" onclick="switchMasterTab('道具')">道具</button>
                    <button class="tab-btn" onclick="switchMasterTab('物料')">物料</button>
                    <button class="tab-btn" onclick="switchMasterTab('重要物品')">重要物品</button>
                    <button class="tab-btn" onclick="switchMasterTab('特殊')">特殊</button>
                    <button class="tab-btn" onclick="switchMasterTab('其他背包')">其他背包</button>
                    
                </div>

                <!-- 动态属性选项 -->
                <div id="dynamicFilters"></div>

                <button class="clear-btn" id="clearBtn" onclick="resetFilters()">🗑️ 清除 0 个过滤器</button>
            </div>
        </div>

        <!-- 右侧：结果展示区域 -->
        <div class="content-area">
            <button class="sort-btn" id="sortBtn" onclick="toggleSort()">📊 价格排序: 默认</button>
            <div id="statusText" style="margin-bottom:15px; color:var(--gray-text); font-size: 14px;">正在读取数据库...</div>
            <div class="grid-container" id="cardsContainer"></div>
        </div>
    </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
        <img class="modal-img" id="modalImg" src="" onerror="this.onerror=null; this.src=fallbackImg;">
        <div class="modal-title" id="modalTitle">物品名称</div>
        <div class="modal-info-list">
            <div class="modal-info-item">
                <div class="modal-info-label">用途</div>
                <div class="modal-info-value" id="modalUsage">暂无</div>
            </div>
            <div class="modal-info-item">
                <div class="modal-info-label">介绍</div>
                <div class="modal-info-value" id="modalIntro">暂无</div>
            </div>
            <div class="modal-info-item">
                <div class="modal-info-label">获取途径</div>
                <div class="modal-info-value" id="modalSource">暂无</div>
            </div>
        </div>
    </div>
</div>

<script>
    const CSV_FILES = {
        '道具礼物': './assets/db/props_is_gift.csv',
        '道具非礼物': './assets/db/props_not_gift.csv',
        '特殊道具': './assets/db/props_is_spec.csv',
        '家具礼物': './assets/db/home_is_gift.csv',
        '家具非礼物': './assets/db/home_not_gift.csv',
        '食物礼物': './assets/db/foods_is_gift.csv',
        '食物非礼物': './assets/db/foods_not_gift.csv',
        '物料': './assets/db/pre_food.csv',
        '重要物品': './assets/db/vip_items.csv',
        '其他背包': './assets/db/spec_bags.csv',
    };

    const CATEGORY_MAPPING = {

        '礼物': ['道具礼物', '食物礼物', '家具礼物'],
        '道具': ['道具礼物', '道具非礼物'],

    };

    const FILTER_CONFIGS = {

            { id: '类别', name: '类别', type: 'tags', options: ['礼物', '道具', '食物', '家装', '物料', '重要物品'] },

        '礼物': [

            { id: '好感翻倍角色', name: '好感翻倍角色', type: 'character_select' },
            { id: '标签', name: '其他', type: 'tags', options: ['可购买', '可拾取', '可偷取', '特殊获取', '不可再生'] }
        ],
        '家装': [

            { id: '规格', name: '规格', type: 'size_tags', options: ['S', 'M', 'L'] },
            { id: '类型', name: '类型', type: 'tags', options: ['家具', '园艺', '养鱼', '墙壁', '装饰', '手办', '唱片机', '一咖舍'] },
            { id: '子类型', name: '子类型', type: 'sub_tags', 
                options: {
                    '家具': ['沙发', '椅子', '床', '桌子', '柜子', '屏风'],
                    '园艺': ['花盆', '花瓶', '花架', '盆栽', '花艺'],
                    '唱片机': [],

                    '墙壁': ['画', '海报', '墙饰', '贴纸'],

        '食物': [

            { id: '子类型', name: '子类型', type: 'tags',

        ],
        '物料': [

            { id: '类别', name: '类别', type: 'tags', options: ['肉类', '蔬菜', '水果', '水产', '调味', '加工品'] },
            { id: '标签', name: '其他', type: 'tags', options: ['可购买', '可拾取'] }
        ],
        '道具': [

            { id: '稀有度', name: '稀有度', type: 'rarity_tags', options: ['绿', '蓝', '紫', '金'] },
            { id: '类型', name: '类型', type: 'tags', options: ['重要道具', '鱼类道具', '养成材料', '异象家具材料', '代币', '礼物', '其他'] },
            { id: '子类型', name: '子类型', type: 'sub_tags',

                    '养成材料': ['经验', '角色突破', '异能升级', '弧盘突破', '空幕卡带', '自选箱'],

    window.addEventListener('DOMContentLoaded', async () => {
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggleBtn').innerHTML = '☀️ 切换日间';
        }

        const savedFilter = localStorage.getItem('filter') || 'union';
        if (savedFilter === 'inter') {
            document.documentElement.setAttribute('data-filter', 'inter');
            document.getElementById('filterToggleBtn').innerHTML = '同组筛选: 满足全部';
        } else {
            document.documentElement.setAttribute('data-filter', 'union');
            document.getElementById('filterToggleBtn').innerHTML = '同组筛选: 满足任意';
        }
        
        // 获取 CSV 并自动根据服务器更新状态刷缓存
        const promises = Object.entries(CSV_FILES).map(async ([key, filePath]) => {
            try {
                // 1. 使用 fetch 发送协商请求（文件更新了才下新的，没变就用 304 本地缓存）
                const response = await fetch(filePath, {
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const csvText = await response.text();

                // 2. 将拿到（或缓存）的文本内容传给 Papa.parse
                return new Promise((resolve) => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: 'greedy', // 彻底跳过只包含空格/逗号的无效空行
                        
                        // 清洗表头：去除 BOM 头以及首尾不可见空格
                        transformHeader: (header) => {
                            return header.replace(/^\ufeff/, '').trim();
                        },

                        complete: (results) => {
                            // 数据二次清洗：去除字段值首尾空格 & 过滤无效行
                            const cleanData = results.data.map(row => {
                                const cleanRow = {};
                                Object.keys(row).forEach(k => {
                                    const cleanKey = k.trim();
                                    const val = row[k];
                                    cleanRow[cleanKey] = typeof val === 'string' ? val.trim() : val;
                                });
                                return cleanRow;
                            }).filter(row => {
                                // 必须包含有效的名称字段，才保留该条记录
                                return row['名称'] && row['名称'] !== '' && row['名称'] !== 'undefined';
                            });

                            allDatabaseData[key] = cleanData;
                            resolve();
                        },

                        error: () => {
                            allDatabaseData[key] = [];
                            resolve();
                        }
                    });
                });
            } catch (error) {
                console.error(`加载 CSV [${key}] 失败:`, error);
                allDatabaseData[key] = [];
            }
        });

        await Promise.all(promises);
        extractCharacters();
        extracthomeSeries();
        extractfoodSeries();
        extractbagsSeries()
        switchMasterTab('全部');
    });

    function splitCellValues(val) {
        if (!val || val === 'null') return [];
        return val.toString()
            .split(/[\r\n、|]+/) // 换行符、|
            .map(s => s.trim())
            .filter(Boolean);
    }

    function extractCharacters() {
        Object.values(allDatabaseData).flat().forEach(row => {
            ['偏好角色', '角色特殊互动'].forEach(col => {
                splitCellValues(row[col]).forEach(c => characterList.add(c));
            });
            splitCellValues(row['好感翻倍角色']).forEach(c => favoriteItemCharacters.add(c));
        });
    }

    function extractfoodSeries() {
        Object.values(allDatabaseData).flat().forEach(row => {
            splitCellValues(row['食物系列']).forEach(s => foodseriesItem.add(s));
        });
    }

    function extracthomeSeries() {
        Object.values(allDatabaseData).flat().forEach(row => {
            splitCellValues(row['家装系列']).forEach(s => homeseriesItem.add(s));
        });
    }

    function extractbagsSeries() {
        Object.values(allDatabaseData).flat().forEach(row => {
            splitCellValues(row['所属背包']).forEach(s => bagsseriesItem.add(s));
        });

    function switchMasterTab(tabName) {
        currentMasterTab = tabName;
        activeFilters = {};
        document.querySelectorAll('#masterTabs .tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.trim() === tabName);
        });
        renderDynamicFilters();
        applyFilterLogic();
    }

    function renderDynamicFilters() {
        const container = document.getElementById('dynamicFilters');
        container.innerHTML = '';
        const configs = FILTER_CONFIGS[currentMasterTab] || [];

        configs.forEach(group => {
            // 💡 1. 级联核心：处理子类型逻辑
            let currentOptions = group.options;

            if (group.name === '子类型'| group.name === '加成类型') {
                const selectedMainTypes = activeFilters['类型'] || [];
                const selectedMainTypes2 = activeFilters['所属背包'] || [];
                
                // 如果未勾选任何“类型”，直接不渲染子类型这一行
                if (selectedMainTypes.length === 0 && selectedMainTypes2.length === 0) return;

                // 根据选中的类型汇总所有可用的子类型（支持在“类型”中多选）
                let matchedOptions = [];
                selectedMainTypes.forEach(t => {
                    if (group.options[t]) matchedOptions.push(...group.options[t]);
                });
                selectedMainTypes2.forEach(t => {
                    if (group.options[t]) matchedOptions.push(...group.options[t]);
                });


                // 去重
                currentOptions = [...new Set(matchedOptions)];

                // 如果该类型下没有配置子类型，跳过渲染
                if (currentOptions.length === 0) return;
            }

            // 2. DOM 节点构建
            const groupEl = document.createElement('div');
            groupEl.className = 'filter-group';

            const title = document.createElement('div');
            title.className = 'filter-title';
            title.innerText = group.name;
            groupEl.appendChild(title);

            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'tags-container';

            // 3. 标签类型按钮渲染
            if (group.type === 'tags' || group.type === 'rarity_tags' || group.type === 'size_tags' || group.type === 'sub_tags') {
                currentOptions.forEach(opt => {
                    const btn = document.createElement('button');
                    
                    // 判断当前 opt 是否已经被选中，补齐 active 样式类
                    const isSelected = activeFilters[group.id] && activeFilters[group.id].includes(opt);
                    btn.className = `tag-btn ${isSelected ? 'active' : ''}`;
                    
                    btn.innerHTML = group.type === 'rarity_tags' ? `<span class="dot dot-${opt}"></span> ${opt}` : opt;
                    
                    // 绑定点击事件，将当前按钮 DOM 传入
                    btn.onclick = () => toggleTag(group.id, opt, btn);
                    tagsContainer.appendChild(btn);
                });
            } else if (group.type === 'character_select') {
                const select = document.createElement('select');
                select.className = 'character-select';
                let optionsSource = (group.id === '好感翻倍角色') ? favoriteItemCharacters : characterList;
                select.innerHTML = `<option value="">未选择角色</option>` + 
                    Array.from(optionsSource).map(c => `<option value="${c}" ${activeFilters[group.id] && activeFilters[group.id][0] === c ? 'selected' : ''}>${c}</option>`).join('');
                select.onchange = (e) => {
                    if (e.target.value) activeFilters[group.id] = [e.target.value];
                    else delete activeFilters[group.id];
                    applyFilterLogic();
                };
                tagsContainer.appendChild(select);
            } else if (group.type === 'food_series_select') {
                const select = document.createElement('select');
                select.className = 'food-series-select';
                let optionsSource = (group.id === '食物系列') ? foodseriesItem : foodseriesList;
                select.innerHTML = `<option value="">未选择系列</option>` + 
                    Array.from(optionsSource).map(c => `<option value="${c}" ${activeFilters[group.id] && activeFilters[group.id][0] === c ? 'selected' : ''}>${c}</option>`).join('');
                select.onchange = (e) => {
                    if (e.target.value) activeFilters[group.id] = [e.target.value];
                    else delete activeFilters[group.id];
                    applyFilterLogic();
                };
                tagsContainer.appendChild(select);
            } else if (group.type === 'home_series_select') {
                const select = document.createElement('select');
                select.className = 'home-series-select';
                let optionsSource = (group.id === '家装系列') ? homeseriesItem : homeseriesList;
                select.innerHTML = `<option value="">未选择系列</option>` + 
                    Array.from(optionsSource).map(c => `<option value="${c}" ${activeFilters[group.id] && activeFilters[group.id][0] === c ? 'selected' : ''}>${c}</option>`).join('');
                select.onchange = (e) => {
                    if (e.target.value) activeFilters[group.id] = [e.target.value];
                    else delete activeFilters[group.id];
                    applyFilterLogic();
                };
                tagsContainer.appendChild(select);
            } else if (group.type === 'bags_series_select') {
                const select = document.createElement('select');
                select.className = 'bags-series-select';
                let optionsSource = (group.id === '所属背包') ? bagsseriesItem : bagsseriesList;
                select.innerHTML = `<option value="">未选择所属背包</option>` + 
                    Array.from(optionsSource).map(c => `<option value="${c}" ${activeFilters[group.id] && activeFilters[group.id][0] === c ? 'selected' : ''}>${c}</option>`).join('');
                
                select.onchange = (e) => {
                    const value = e.target.value;
                    
                    // 更新 activeFilters（单选，直接覆盖）
                    if (value) {
                        activeFilters[group.id] = [value];
                    } else {
                        delete activeFilters[group.id];
                    }
                    
                    // 联动刷新子类型
                    if (group.id === '所属背包') {
                        cleanInvalidSubTypes();
                        renderDynamicFilters();
                    }
                    
                    applyFilterLogic();
                };
                tagsContainer.appendChild(select);
            }
            groupEl.appendChild(tagsContainer);
            container.appendChild(groupEl);
        });
    }

    function toggleTag(groupId, val, btn) {
        if (!activeFilters[groupId]) activeFilters[groupId] = [];
        const idx = activeFilters[groupId].indexOf(val);
        if (idx > -1) {
            activeFilters[groupId].splice(idx, 1);
            if (!activeFilters[groupId].length) delete activeFilters[groupId];
        } else {
            activeFilters[groupId].push(val);
        }

        // 💡 核心改动：点击“类型”时，处理子类型联动
        if (groupId === '类型') {
            cleanInvalidSubTypes();      // 清理原先选中但现在无效的子类型
            renderDynamicFilters();     // 重新渲染筛选区域（内部会自动重新给 active 按钮加上 active 类）
        } else {
            // 普通标签点击，直接切换当前按钮高亮样式
            btn.classList.toggle('active');
        }
        applyFilterLogic();
    }

    function cleanInvalidSubTypes() {
        if (!activeFilters['子类型']) return;

        const selectedMainTypes = activeFilters['类型'] || [];
        const selectedMainTypes2 = activeFilters['所属背包'] || [];
        const subConfig = (FILTER_CONFIGS[currentMasterTab] || []).find(g => g.id === '子类型');

        // 如果主类型被全部取消选择，或者找不到子类型配置，清空已选子类型
        if (!subConfig || (selectedMainTypes.length === 0 && selectedMainTypes2.length === 0) ) {
            delete activeFilters['子类型'];
            return;
        }

        // 汇总当前所有合法子类型选项
        let validSubOptions = [];
        selectedMainTypes.forEach(t => {
            if (subConfig.options[t]) validSubOptions.push(...subConfig.options[t]);
        });
        selectedMainTypes2.forEach(t => {
            if (subConfig.options[t]) validSubOptions.push(...subConfig.options[t]);
        });

        // 过滤掉不在合法池中的已选子类型
        activeFilters['子类型'] = activeFilters['子类型'].filter(sub => validSubOptions.includes(sub));
        if (!activeFilters['子类型'].length) delete activeFilters['子类型'];
    }

    function applyFilterLogic() {
        let currentData = [];
        if (currentMasterTab === '礼物') {
            const giftSources = ['道具礼物', '食物礼物'];
            giftSources.forEach(key => {
                if (allDatabaseData[key]) {
                    currentData = currentData.concat(allDatabaseData[key]);
                }
            });
            if (allDatabaseData['家具礼物']) {
                currentData = currentData.concat(allDatabaseData['家具礼物']);
            }
        } else {
            const subCsvKeys = CATEGORY_MAPPING[currentMasterTab] || [];
            subCsvKeys.forEach(key => {
                if (allDatabaseData[key]) {
                    currentData = currentData.concat(allDatabaseData[key]);
                }
            });
        }

        // 💡 获取当前的同类标签筛选模式 ('inter' 为交集/AND，否则为并集/OR)
        const isInterMode = document.documentElement.getAttribute('data-filter') === 'inter';
        
        let filtered = currentData.filter(row => {
            // 1. 搜索框筛选
            if (searchQuery) {
                const match = Object.values(row).some(v => v && v.toString().toLowerCase().includes(searchQuery));
                if (!match) return false;
            }

            // 2. 标签组筛选
            for (let [groupId, valList] of Object.entries(activeFilters)) {
                // 如果该筛选组没有选择任何值，跳过
                if (!valList || valList.length === 0) continue;

                const cellValues = splitCellValues(row[groupId] || row['其他'] || row['标签'] || row['类型']);
                
                // 💡 核心修改点：根据模式决定同组内是“同时满足”还是“满足任意”
                const match = isInterMode 
                    ? valList.every(v => cellValues.includes(v))  // 交集模式 (AND): 选中的值必须全部存在
                    : valList.some(v => cellValues.includes(v));   // 并集模式 (OR):  选中的值只需满足一个

                if (!match) return false;
            }
            return true;
        });

        // 3. 排序逻辑
        if (sortMode !== 0) {
            filtered.sort((a, b) => {
                let priceA = parseFloat(a['价格']);
                let priceB = parseFloat(b['价格']);
                
                let hasA = !isNaN(priceA);
                let hasB = !isNaN(priceB);
                if (!hasA && !hasB) return 0;
                if (!hasA) return 1;
                if (!hasB) return -1;

                return sortMode === 1 ? priceA - priceB : priceB - priceA;
            });
        }

        // 4. 渲染与状态更新
        renderCards(filtered);
        
        let count = 0;
        Object.values(activeFilters).forEach(a => count += a.length);
        document.getElementById('clearBtn').innerText = `🗑️ 清除 ${count} 个过滤器`;
        document.getElementById('statusText').innerText = `【${currentMasterTab}】共有 ${filtered.length} 项`;
    }
    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';

        const formatAttr = (label, value, prefix = '') => {
            if (!value || value === 'null' || value === 'undefined') return '';
            return `<div><b>${label}:</b> ${prefix}${value}</div>`;
        };

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openModal(item);

            const imgPath = `./assets/images/${item['名称']}.png`;

            let attrHtml = '';
            if (currentMasterTab === '礼物') {
                attrHtml = formatAttr('价格', item['价格']) + formatAttr('好感', item['好感'], '+');
            } else if (currentMasterTab === '家装') {
                attrHtml = formatAttr('价格', item['价格']) + formatAttr('舒适度', item['舒适度']) + formatAttr('收藏值', item['收藏值']);
            } else {
                attrHtml = formatAttr('价格', item['价格']);
            }

            const itemName = item['名称'] || '未命名';
            

            // 注意这里的 <span class="item-name-inner"> 包裹
            card.innerHTML = `
                <img class="item-img" src="${imgPath}" onerror="this.onerror=null; this.src='${fallbackImg}';">
                <div class="item-name">
                    <span class="item-name-inner">${itemName}</span>
                </div>
                <div class="item-attr">
                    ${attrHtml}
                </div>
            `;

            container.appendChild(card);

            // 💡 动态检测并计算精确滚动距离
            const nameContainer = card.querySelector('.item-name');
            const nameInner = card.querySelector('.item-name-inner');

            const overflowWidth = nameInner.offsetWidth - nameContainer.clientWidth;
            
            // 如果文字宽度超过了外层容器，开启滚动并传入精准偏移量
            if (overflowWidth > 0) {
                // 计算需要往左滚动的像素值 (留 4px 余量)
                nameInner.style.setProperty('--scroll-offset', `-${overflowWidth + 4}px`);
                nameInner.classList.add('scroll');
            }
        });
    }

    function openModal(item) {
        const imgPath = `./assets/images/${item['名称']}.png`;
        document.getElementById('modalImg').src = imgPath;
        document.getElementById('modalTitle').innerText = item['名称'] || '未命名';
        
        document.getElementById('modalUsage').innerText = item['用途'] || item['属性'] || '暂无';
        document.getElementById('modalIntro').innerText = item['介绍'] || item['描述'] || '暂无';
        document.getElementById('modalSource').innerText = item['获取途径'] || item['标签'] || item['其他'] || '暂无';

        document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    function closeModalOnOverlay(event) {
        if (event.target.id === 'detailModal') {
            closeModal();
        }
    }

    function resetFilters() {
        activeFilters = {};
        searchQuery = '';
        sortMode = 0;
        document.getElementById('searchInput').value = '';
        document.getElementById('sortBtn').innerHTML = '📊 价格排序: 默认';
        renderDynamicFilters();
        applyFilterLogic();
    }

    document.getElementById('searchInput').addEventListener('input', e => {
        searchQuery = e.target.value.trim().toLowerCase();
        applyFilterLogic();
    });
</script>
</body>
</html>
