<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTE Wiki 》items DB | 异环Wiki 》物品数据库</title>
    <!-- 引入 PapaParse 解析 CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-main: #eef2f7;
            --panel-bg: #dce3ed;
            --btn-bg: #edf1f7;
            --btn-active-bg: #000000;
            --btn-active-text: #ffffff;
            --text-color: #2b3648;
            --gray-text: #6e7c91;
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.05);
            --panel-shadow: 0 4px 15px rgba(0,0,0,0.05);
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        [data-theme="dark"] {
            --bg-main: #121824;
            --panel-bg: #1e2636;
            --btn-bg: #2a3447;
            --btn-active-bg: #ffffff;
            --btn-active-text: #000000;
            --text-color: #e2e8f0;
            --gray-text: #94a3b8;
            --card-bg: #1a2230;
            --input-bg: #222b3b;
            --input-border: #334155;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
            --panel-shadow: 0 4px 15px rgba(0,0,0,0.3);
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            margin: 20px;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            box-sizing: border-box;
            width: 100%;
        }

        /* 左右分栏布局：参考标准响应式，大屏左右，小屏上下 */
        .main-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }

        .sidebar {
            flex: 0 0 320px;
            position: sticky;
            top: 20px;
            box-sizing: border-box;
        }

        .content-area {
            flex: 1;
            min-width: 0;
            box-sizing: border-box;
        }

        .filter-card {
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--panel-shadow);
            margin-bottom: 25px;
            transition: background-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 180px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
        .character-select {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .theme-toggle-btn, .sort-btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle-btn:hover, .sort-btn:hover {
            opacity: 0.8;
        }

        /* 主选单 */
        .master-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--input-border);
            padding-bottom: 12px;
        }
        .tab-btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--btn-active-bg);
            color: var(--btn-active-text);
        }

        .filter-group { margin-bottom: 15px; }
        .filter-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--text-color); }
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; box-sizing: border-box; }

        .tag-btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .tag-btn.active { background: var(--btn-active-bg); color: var(--btn-active-text); }

        .clear-btn {
            width: 100%;
            background: var(--btn-bg);
            border: none;
            padding: 10px;
            border-radius: 20px;
            color: var(--gray-text);
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .clear-btn:hover {
            opacity: 0.9;
        }

        /* 响应式网格流，auto-fill 配合 minmax */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
            gap: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
        }
        .item-card:hover { transform: translateY(-3px); }
        .item-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: var(--input-bg);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .item-name { font-weight: bold; font-size: 15px; margin-bottom: 6px; text-align: center; color: var(--text-color); width: 100%; word-break: break-all; }
        .item-attr { font-size: 12px; color: var(--gray-text); width: 100%; box-sizing: border-box; }
        .item-attr div { margin-bottom: 4px; white-space: pre-line; word-break: break-all; }
        
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-绿 { background-color: #22c55e; } .dot-蓝 { background-color: #3b82f6; }
        .dot-紫 { background-color: #a855f7; } .dot-金 { background-color: #eab308; }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--panel-shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .modal-close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--gray-text);
        }
        .modal-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: var(--input-bg);
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .modal-info-item {
            background: var(--input-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            box-sizing: border-box;
        }
        .modal-info-label {
            font-weight: bold;
            color: var(--gray-text);
            margin-bottom: 4px;
            font-size: 12px;
        }
        .modal-info-value {
            white-space: pre-line;
            line-height: 1.4;
            word-break: break-all;
        }

        /* 响应式断点：自适应折叠规则，屏幕较小时侧边栏移到上方 */
        @media (max-width: 1100px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                flex: none;
                width: 100%;
                position: static;
            }
            .content-area {
                width: 100%;
            }
        }
         /* 移动端适配，适当调大全局基础字号，控件整体放大 */
        @media (max-width: 768px) {
            body {
                margin: 10px;
                font-size: 16px;
            }
            .filter-card {
                padding: 20px;
                border-radius: 16px;
            }
            .top-bar {
                flex-direction: column;
                gap: 12px;
            }
            .search-input {
                font-size: 16px;
                padding: 14px 20px;
            }
            .theme-toggle-btn, .sort-btn {
                font-size: 16px;
                padding: 12px 16px;
            }
            .tab-btn {
                font-size: 15px;
                padding: 10px 16px;
            }
            .tag-btn {
                font-size: 15px;
                padding: 10px 16px;
            }
            .character-select {
                font-size: 16px;
                padding: 10px 16px;
            }
            .clear-btn {
                font-size: 15px;
                padding: 14px;
            }
            .search-input, .theme-toggle-btn, .sort-btn {
                width: 100%;
                box-sizing: border-box;
                text-align: center;
                justify-content: center;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-layout">
        <!-- 左侧：筛选与控制面板区域 -->
        <div class="sidebar">
            <div class="filter-card">
                <div class="top-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索名称、介绍、描述...">
                    <button class="sort-btn" id="sortBtn" onclick="toggleSort()">📊 价格排序: 默认</button>
                    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 暗黑模式</button>
                </div>

                <!-- 主选单 -->
                <div class="master-tabs" id="masterTabs">
                    <button class="tab-btn active" onclick="switchMasterTab('礼物')">🎁 礼物</button>
                    <button class="tab-btn" onclick="switchMasterTab('家装')">🪑 家装</button>
                    <button class="tab-btn" onclick="switchMasterTab('食物')">🍱 食物</button>
                    <button class="tab-btn" onclick="switchMasterTab('物料')">🥬 物料</button>
                    <button class="tab-btn" onclick="switchMasterTab('道具')">🎒 道具</button>
                    <button class="tab-btn" onclick="switchMasterTab('重要物品')">🔑 重要物品</button>
                </div>

                <!-- 动态属性选项 -->
                <div id="dynamicFilters"></div>

                <button class="clear-btn" id="clearBtn" onclick="resetFilters()">🗑️ 清除 0 个过滤器</button>
            </div>
        </div>

        <!-- 右侧：结果展示区域 -->
        <div class="content-area">
            <div id="statusText" style="margin-bottom:15px; color:var(--gray-text); font-size: 14px;">正在读取数据库...</div>
            <div class="grid-container" id="cardsContainer"></div>
        </div>
    </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
        <img class="modal-img" id="modalImg" src="" onerror="this.src='https://via.placeholder.com/80?text=No+Img'">
        <div class="modal-title" id="modalTitle">物品名称</div>
        <div class="modal-info-list">
            <div class="modal-info-item">
                <div class="modal-info-label">用途</div>
                <div class="modal-info-value" id="modalUsage">暂无</div>
            </div>
            <div class="modal-info-item">
                <div class="modal-info-label">介绍</div>
                <div class="modal-info-value" id="modalIntro">暂无</div>
            </div>
            <div class="modal-info-item">
                <div class="modal-info-label">获取途径</div>
                <div class="modal-info-value" id="modalSource">暂无</div>
            </div>
        </div>
    </div>
</div>

<script>
    const CSV_FILES = {
        '道具礼物': './assets/db/props_is_gift.csv',
        '道具非礼物': './assets/db/props_not_gift.csv',
        '家具礼物': './assets/db/home_is_gift.csv',
        '家具非礼物': './assets/db/home_not_gift.csv',
        '食物礼物': './assets/db/foods_is_gift.csv',
        '食物非礼物': './assets/db/foods_not_gift.csv',
        '物料': './assets/db/pre_food.csv',
        '重要物品': './assets/db/vip_items.csv'
    };

    const CATEGORY_MAPPING = {
        '礼物': ['道具礼物', '食物礼物', '家具礼物'],
        '道具': ['道具礼物', '道具非礼物'],
        '家装': ['家具礼物', '家具非礼物'],
        '食物': ['食物礼物', '食物非礼物'],
        '物料': ['物料'],
        '重要物品': ['重要物品']
    };

    const FILTER_CONFIGS = {
        '礼物': [
            { id: '类别', name: '类别', type: 'tags', options: ['道具', '食物', '家装'] },
            { id: '好感', name: '好感', type: 'tags', options: ['50', '100', '200', '300', '400', '2000'] },
            { id: '好感翻倍角色', name: '好感翻倍角色', type: 'character_select' },
            { id: '标签', name: '其他', type: 'tags', options: ['可购买', '可拾取', '特殊获取', '不可再生'] }
        ],
        '家装': [
            { id: '类别', name: '类别', type: 'tags', options: ['家装', '绿植', '唱片机', '鱼缸', '墙壁装饰', '摆件', '异象家具'] },
            { id: '子类别', name: '子类别', type: 'tags', options: ['沙发', '椅子', '床', '桌子', '柜子', '屏风', '花盆', '花架', '盆栽', '画', '海报', '墙饰', '贴纸', '大手办', '摆件', '工艺品', '乐器', '书', '灯饰', '家庭休闲'] },
            { id: '稀有度', name: '稀有度', type: 'rarity_tags', options: ['绿', '蓝', '紫', '金'] },
            { id: '角色家具互动', name: '角色家具互动', type: 'character_select' },
            { id: '标签', name: '其他', type: 'tags', options: ['可购买', '可拾取', '特殊获取', '家具互动', '一咖舍', '手办'] }
        ],
        '食物': [
            { id: '加成类型', name: '加成类型', type: 'tags', options: ['百分比', '数值', '一次性', '持续', '混合', '复活', '单体', '全队'] },
            { id: '加成效果', name: '加成效果', type: 'tags', options: ['生命', '防御', '攻击', '暴击伤害', '暴击率', '体力回复速度', '体力消耗降低'] },
            { id: '食物系列', name: '食物系列', type: 'tags', options: ['畅爽系列', '2-Four便利店系列', '噗卡糖果系列'] },
            { id: '稀有度', name: '稀有度', type: 'rarity_tags', options: ['绿', '蓝', '紫', '金'] },
            { id: '标签', name: '其他', type: 'tags', options: ['可购买', '可拾取', '特殊获取', '不可再生'] }
        ],
        '物料': [
            { id: '类别', name: '类别', type: 'tags', options: ['肉类', '蔬菜', '水果', '调味', '奶', '其他'] },
            { id: '标签', name: '其他', type: 'tags', options: ['可购买', '可拾取'] }
        ],
        '道具': [
            { id: '类别', name: '类别', type: 'tags', options: ['重要道具', '养成材料', '异能强化材料', '异能提升材料', '异象家具材料', '空幕卡带用'] },
            { id: '子类别', name: '子类别', type: 'tags', options: ['弧盘材料', '角色材料', '经验材料', '突破材料'] },
            { id: '标签', name: '其他', type: 'tags', options: ['可购买', '可拾取', '可刷取', '特殊获取', '不可再生', '自选类', '失物类', '兑换折扣类'] }
        ],
        '重要物品': [
            { id: '类别', name: '类别', type: 'tags', options: ['车钥匙', '快捷技能', '任务道具', '监狱道具', '粉爪道具'] },
            { id: '标签', name: '其他', type: 'tags', options: ['不可再生'] }
        ]
    };

    let allDatabaseData = {};
    let characterList = new Set();
    let favoriteItemCharacters = new Set();
    let currentMasterTab = '礼物';
    let searchQuery = '';
    let activeFilters = {};
    let sortMode = 0; // 0: 默认, 1: 价格升序, 2: 价格降序

    window.addEventListener('DOMContentLoaded', async () => {
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggleBtn').innerHTML = '☀️ 浅色模式';
        }

        const promises = Object.entries(CSV_FILES).map(([key, filePath]) => {
            return new Promise((resolve) => {
                Papa.parse(filePath, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        allDatabaseData[key] = results.data;
                        resolve();
                    },
                    error: () => {
                        allDatabaseData[key] = [];
                        resolve();
                    }
                });
            });
        });

        await Promise.all(promises);
        extractCharacters();
        switchMasterTab('礼物');
    });

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const btn = document.getElementById('themeToggleBtn');
        if (currentTheme === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            btn.innerHTML = '🌙 暗黑模式';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            btn.innerHTML = '☀️ 浅色模式';
        }
    }

    function toggleSort() {
        sortMode = (sortMode + 1) % 3;
        const btn = document.getElementById('sortBtn');
        if (sortMode === 0) {
            btn.innerHTML = '📊 价格排序: 默认';
        } else if (sortMode === 1) {
            btn.innerHTML = '📈 价格排序: 升序';
        } else if (sortMode === 2) {
            btn.innerHTML = '📉 价格排序: 降序';
        }
        applyFilterLogic();
    }

    function splitCellValues(val) {
        if (!val || val === 'null') return [];
        return val.toString().split(/[\r\n]+/).map(s => s.trim()).filter(Boolean);
    }

    function extractCharacters() {
        Object.values(allDatabaseData).flat().forEach(row => {
            ['偏好角色', '角色家具互动'].forEach(col => {
                splitCellValues(row[col]).forEach(c => characterList.add(c));
            });
            splitCellValues(row['好感翻倍角色']).forEach(c => favoriteItemCharacters.add(c));
        });
    }

    function switchMasterTab(tabName) {
        currentMasterTab = tabName;
        activeFilters = {};
        document.querySelectorAll('#masterTabs .tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(tabName));
        });
        renderDynamicFilters();
        applyFilterLogic();
    }

    function renderDynamicFilters() {
        const container = document.getElementById('dynamicFilters');
        container.innerHTML = '';
        const configs = FILTER_CONFIGS[currentMasterTab] || [];

        configs.forEach(group => {
            const groupEl = document.createElement('div');
            groupEl.className = 'filter-group';

            const title = document.createElement('div');
            title.className = 'filter-title';
            title.innerText = group.name;
            groupEl.appendChild(title);

            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'tags-container';

            if (group.type === 'tags' || group.type === 'rarity_tags') {
                group.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'tag-btn';
                    btn.innerHTML = group.type === 'rarity_tags' ? `<span class="dot dot-${opt}"></span> ${opt}` : opt;
                    btn.onclick = () => toggleTag(group.id, opt, btn);
                    tagsContainer.appendChild(btn);
                });
            } else if (group.type === 'character_select') {
                const select = document.createElement('select');
                select.className = 'character-select';
                let optionsSource = (group.id === '好感翻倍角色') ? favoriteItemCharacters : characterList;
                select.innerHTML = `<option value="">全部角色</option>` + 
                    Array.from(optionsSource).map(c => `<option value="${c}" ${activeFilters[group.id] && activeFilters[group.id][0] === c ? 'selected' : ''}>${c}</option>`).join('');
                select.onchange = (e) => {
                    if (e.target.value) activeFilters[group.id] = [e.target.value];
                    else delete activeFilters[group.id];
                    applyFilterLogic();
                };
                tagsContainer.appendChild(select);
            }
            groupEl.appendChild(tagsContainer);
            container.appendChild(groupEl);
        });
    }

    function toggleTag(groupId, val, btn) {
        btn.classList.toggle('active');
        if (!activeFilters[groupId]) activeFilters[groupId] = [];
        const idx = activeFilters[groupId].indexOf(val);
        if (idx > -1) {
            activeFilters[groupId].splice(idx, 1);
            if (!activeFilters[groupId].length) delete activeFilters[groupId];
        } else {
            activeFilters[groupId].push(val);
        }
        applyFilterLogic();
    }

    function applyFilterLogic() {
        let currentData = [];
        if (currentMasterTab === '礼物') {
            const giftSources = ['道具礼物', '食物礼物'];
            giftSources.forEach(key => {
                if (allDatabaseData[key]) {
                    currentData = currentData.concat(allDatabaseData[key]);
                }
            });
            if (allDatabaseData['家具礼物']) {
                currentData = currentData.concat(allDatabaseData['家具礼物']);
            }
        } else {
            const subCsvKeys = CATEGORY_MAPPING[currentMasterTab] || [];
            subCsvKeys.forEach(key => {
                if (allDatabaseData[key]) {
                    currentData = currentData.concat(allDatabaseData[key]);
                }
            });
        }
        
        let filtered = currentData.filter(row => {
            if (searchQuery) {
                const match = Object.values(row).some(v => v && v.toString().toLowerCase().includes(searchQuery));
                if (!match) return false;
            }

            for (let [groupId, valList] of Object.entries(activeFilters)) {
                const cellValues = splitCellValues(row[groupId] || row['其他'] || row['标签']);
                const match = valList.some(v => cellValues.includes(v));
                if (!match) return false;
            }
            return true;
        });

        if (sortMode !== 0) {
            filtered.sort((a, b) => {
                let priceA = parseFloat(a['价格']);
                let priceB = parseFloat(b['价格']);
                
                let hasA = !isNaN(priceA);
                let hasB = !isNaN(priceB);
                if (!hasA && !hasB) return 0;
                if (!hasA) return 1;
                if (!hasB) return -1;

                return sortMode === 1 ? priceA - priceB : priceB - priceA;
            });
        }

        renderCards(filtered);
        
        let count = 0;
        Object.values(activeFilters).forEach(a => count += a.length);
        document.getElementById('clearBtn').innerText = `🗑️ 清除 ${count} 个过滤器`;
        document.getElementById('statusText').innerText = `【${currentMasterTab}】共有 ${filtered.length} 项`;
    }

    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openModal(item);

            const imgPath = `./assets/images/${item['名称']}.png`;

            card.innerHTML = `
                <img class="item-img" src="${imgPath}" onerror="this.src='https://via.placeholder.com/50?text=No+Img'">
                <div class="item-name">${item['名称'] || '未命名'}</div>
                <div class="item-attr">
                    ${item['价格'] && item['价格'] !== 'null' ? `<div><b>价格:</b> ${item['价格']}</div>` : ''}
                    ${item['好感'] && item['好感'] !== 'null' ? `<div><b>好感:</b> +${item['好感']}</div>` : ''}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openModal(item) {
        const imgPath = `./assets/images/${item['名称']}.png`;
        document.getElementById('modalImg').src = imgPath;
        document.getElementById('modalTitle').innerText = item['名称'] || '未命名';
        
        document.getElementById('modalUsage').innerText = item['用途'] || item['属性'] || '暂无';
        document.getElementById('modalIntro').innerText = item['介绍'] || item['描述'] || '暂无';
        document.getElementById('modalSource').innerText = item['获取途径'] || item['标签'] || item['其他'] || '暂无';

        document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    function closeModalOnOverlay(event) {
        if (event.target.id === 'detailModal') {
            closeModal();
        }
    }

    function resetFilters() {
        activeFilters = {};
        searchQuery = '';
        sortMode = 0;
        document.getElementById('searchInput').value = '';
        document.getElementById('sortBtn').innerHTML = '📊 价格排序: 默认';
        renderDynamicFilters();
        applyFilterLogic();
    }

    document.getElementById('searchInput').addEventListener('input', e => {
        searchQuery = e.target.value.trim().toLowerCase();
        applyFilterLogic();
    });
</script>
</body>
</html>
